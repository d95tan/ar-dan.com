name: external-links

on:
  schedule:
    - cron: '0 1 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  external-links:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: lycheeverse/lychee-action@v2
        with:
          # LinkedIn answers bots with 999 and some sites rate-limit with 429; neither means the link is broken.
          args: >-
            --no-progress
            --max-retries 3
            --accept '200..=299,403,429,999'
            --exclude 'ar-dan\.com'
            --exclude 'localhost'
            './src/**/*.md' './src/**/*.yml' './src/site.ts' './README.md'
          fail: false
